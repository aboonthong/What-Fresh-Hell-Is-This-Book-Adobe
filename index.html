<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Fresh Hell Is This Book</title>
    <link href="dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
    <link href="dflip/css/themify-icons.min.css" rel="stylesheet" type="text/css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Clean fallback / reopen button if user closes the lightbox */
        .fallback-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 16px;
        }

        ._df_button {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffffff;
            background-color: #111111;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        ._df_button:hover {
            background-color: #333333;
        }

        .back-link {
            font-size: 13px;
            color: #555555;
            text-decoration: none;
            border-bottom: 1px solid #999999;
            padding-bottom: 2px;
        }

        .back-link:hover {
            color: #000000;
            border-bottom-color: #000000;
        }
    </style>
</head>
<body>

    <div class="fallback-container">
        <button class="_df_button" source="What-Fresh-Hell-Is-This_Book.pdf" id="df_manual_book">
            Open Flipbook
        </button>
        <a href="javascript:void(0);" onclick="exitFlipbook();" class="back-link">
            ← Back to Portfolio
        </a>
    </div>

    <script src="dflip/js/libs/jquery.min.js" type="text/javascript"></script>
    <script src="dflip/js/dflip.min.js" type="text/javascript"></script>

    <script>
        function exitFlipbook() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.close();
            }
        }

        // Automatically open the DearFlip lightbox as soon as the page loads
        // and hook the built-in lightbox close ('X') button to return to your portfolio
        window.addEventListener('load', function () {
            setTimeout(function () {
                var bookBtn = document.getElementById('df_manual_book');
                if (bookBtn) {
                    bookBtn.click();
                }

                // Listen for clicks on DearFlip's lightbox close button (.df-ui-close)
                document.addEventListener('click', function (e) {
                    if (e.target.closest('.df-ui-close') || e.target.classList.contains('df-lightbox-bg')) {
                        exitFlipbook();
                    }
                });
            }, 250);
        });
    </script>

</body>
</html>
