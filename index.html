<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Fresh Hell Is This Book</title>
    <link href="dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
    <link href="dflip/css/themify-icons.min.css" rel="stylesheet" type="text/css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #222222; /* Matches DearFlip lightbox backdrop so there is zero white flash */
            overflow: hidden;
        }

        /* Keep the trigger completely invisible so it never shows behind or after the flipbook */
        ._df_button {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <button class="_df_button" source="What-Fresh-Hell-Is-This_Book.pdf" id="df_manual_book">Open</button>

    <script src="dflip/js/libs/jquery.min.js" type="text/javascript"></script>
    <script src="dflip/js/dflip.min.js" type="text/javascript"></script>

    <script>
        function returnToPortfolio() {
            // 1. If opened in the same tab from your portfolio, go straight back
            if (window.history.length > 1 && document.referrer) {
                window.history.back();
                return;
            }
            // 2. If opened in a new tab by Adobe Portfolio, close the tab
            window.close();
            // 3. Fallback if the browser blocks window.close()
            setTimeout(function () {
                window.location.href = "https://arkaraboonthong.myportfolio.com/re-sources";
            }, 150);
        }

        window.addEventListener('load', function () {
            var bookBtn = document.getElementById('df_manual_book');
            if (bookBtn) {
                bookBtn.click();
            }

            // Watch the DOM for DearFlip's lightbox being closed/removed
            var lightboxOpened = false;
            var observer = new MutationObserver(function () {
                var lightbox = document.querySelector('.df-lightbox-wrapper');
                if (lightbox && lightbox.style.display !== 'none') {
                    lightboxOpened = true;
                } else if (lightboxOpened) {
                    observer.disconnect();
                    returnToPortfolio();
                }
            });

            observer.observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['style', 'class']
            });

            // Capture click on the 'X' button in the capture phase (before DearFlip stops propagation)
            document.addEventListener('click', function (e) {
                if (e.target.closest('.df-ui-close')) {
                    returnToPortfolio();
                }
            }, true);
        });
    </script>

</body>
</html>
